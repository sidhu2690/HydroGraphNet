# Sample Verification Config (runs end-to-end on CPU in ~40s, or GPU in <3s)

seed: 42

data_dir: ./data_sample
test_dir: ./data_sample/Test
prefix: M80
train_ids_file: train.txt
test_ids_file: test.txt
num_training_samples: 6
num_test_samples: 3
n_time_steps: 2
k_neighbors: 4
skip_initial_steps: 72
delta_t: 1200.0

model:
  input_dim_nodes: 16
  input_dim_edges: 3
  output_dim: 2
  hidden_dim: 64
  processor_size: 5
  num_layers_node_encoder: 2
  num_layers_edge_encoder: 2
  num_layers_node_processor: 2
  num_layers_edge_processor: 2
  num_layers_node_decoder: 2
  mlp_activation_fn: silu
  aggregation: sum
  do_concat_trick: true
  checkpoint_segments: 0

batch_size: 2
epochs: 4
max_steps_per_epoch: 45
lr: 3.0e-4
min_lr: 1.0e-5
weight_decay: 1.0e-5
scheduler: cosine
grad_clip_norm: 1.0

noise_type: random_walk
noise_std: 0.01

device: auto
amp: false
compile: false
num_workers: 0

ckpt_dir: ./checkpoints_sample
output_dir: ./outputs_sample
val_every_epochs: 1
num_test_time_steps: 62
