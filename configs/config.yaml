# Full-Scale GPU Training Configuration — White River (Zenodo 15491288)
# Simplified KAN-Free MLP-MeshGraphNet trained purely with 1-step L_pred + random-walk noise.

seed: 42

data_dir: ./data
test_dir: ./data/Test
prefix: M80
train_ids_file: train.txt
test_ids_file: test.txt
num_training_samples: 500
num_test_samples: 10
n_time_steps: 2
k_neighbors: 4
skip_initial_steps: 72
delta_t: 1200.0

model:
  input_dim_nodes: 16          # 10 static + 2 forcing + 2*n_time_steps
  input_dim_edges: 3           # [dx, dy, distance]
  output_dim: 2                # [delta_water_depth, delta_volume]
  hidden_dim: 64               # Set 128 + processor_size: 15 to scale up on large GPUs
  processor_size: 5
  num_layers_node_encoder: 2
  num_layers_edge_encoder: 2
  num_layers_node_processor: 2
  num_layers_edge_processor: 2
  num_layers_node_decoder: 2
  mlp_activation_fn: silu
  aggregation: sum
  do_concat_trick: true
  checkpoint_segments: 0

batch_size: 8
epochs: 150
max_steps_per_epoch: null
lr: 3.0e-4
min_lr: 1.0e-6
weight_decay: 1.0e-5
scheduler: cosine
grad_clip_norm: 1.0

# Pfaff et al. (2020) random-walk input noise with drift-corrected target increment
noise_type: random_walk
noise_std: 0.01

device: auto
amp: true
compile: false
num_workers: 4

ckpt_dir: ./checkpoints
output_dir: ./outputs
val_every_epochs: 5
num_test_time_steps: 60
